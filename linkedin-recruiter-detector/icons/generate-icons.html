<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<p>Open this file in a browser, right-click each canvas, and "Save image as" to create the PNG icons.</p>
<canvas id="c16" width="16" height="16"></canvas>
<canvas id="c48" width="48" height="48"></canvas>
<canvas id="c128" width="128" height="128"></canvas>
<script>
function drawIcon(canvas) {
  const s = canvas.width;
  const ctx = canvas.getContext("2d");

  // Background circle
  ctx.fillStyle = "#1a1a2e";
  ctx.beginPath();
  ctx.arc(s/2, s/2, s/2, 0, Math.PI * 2);
  ctx.fill();

  // Bell shape
  ctx.fillStyle = "#e94560";
  ctx.strokeStyle = "#e94560";
  ctx.lineWidth = s * 0.06;
  ctx.beginPath();
  const bw = s * 0.45; // bell width
  const bh = s * 0.4;  // bell height
  const cx = s / 2;
  const top = s * 0.22;
  // Bell body (simplified)
  ctx.moveTo(cx - bw/2, top + bh);
  ctx.quadraticCurveTo(cx - bw/2, top, cx, top);
  ctx.quadraticCurveTo(cx + bw/2, top, cx + bw/2, top + bh);
  ctx.lineTo(cx - bw/2, top + bh);
  ctx.fill();

  // Bell bottom bar
  ctx.fillRect(cx - bw * 0.65, top + bh, bw * 1.3, s * 0.06);

  // Bell clapper
  ctx.beginPath();
  ctx.arc(cx, top + bh + s * 0.12, s * 0.06, 0, Math.PI * 2);
  ctx.fill();

  // Red notification dot
  ctx.fillStyle = "#ff2e2e";
  ctx.beginPath();
  ctx.arc(cx + bw * 0.4, top + s * 0.05, s * 0.12, 0, Math.PI * 2);
  ctx.fill();
}

drawIcon(document.getElementById("c16"));
drawIcon(document.getElementById("c48"));
drawIcon(document.getElementById("c128"));
</script>
</body>
</html>
